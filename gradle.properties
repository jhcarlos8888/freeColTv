org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# La ruta del repo contiene espacios ("NEGOCIOS Y FINANZAS"), lo que rompe la
# compilación incremental de Kotlin (la clasepath se trunca en el espacio).
# Se desactiva el incremental para que compile de forma fiable.
kotlin.incremental=false

